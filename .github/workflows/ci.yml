name: CI
on: [push, pull_request]
jobs:
  transpiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install flex and bison
        run: sudo apt-get update && sudo apt-get install -y flex bison
      - name: Build and run the Tcl to C++ transpiler tests
        working-directory: Lexing-and-Parsing/Tcl-to-Cpp-Transpiler/Qn3/build
        run: make test
